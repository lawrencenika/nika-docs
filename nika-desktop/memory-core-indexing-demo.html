<html lang="en">
<head>
<meta charset="utf-8">
<title>NIKA Memory Core — File Indexing Demo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/h3-js@4.1.0/dist/h3-js.umd.js"></script>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<style>
  :root {
    --bg:#0d1117; --panel:#161b22; --line:#30363d; --text:#c9d1d9;
    --muted:#8b949e; --accent:#58a6ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font:13px/1.45 ui-sans-serif,system-ui,sans-serif}
  header{display:flex;align-items:center;gap:18px;
    padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{margin:0;font-size:14px;font-weight:600}
  header .meta{color:var(--muted);font-size:12px}
  header .tabs{margin-left:auto;display:flex;gap:6px}
  header .tabs button{background:transparent;color:var(--text);
    border:1px solid var(--line);padding:5px 14px;cursor:pointer;
    border-radius:4px;font-size:12px}
  header .tabs button.active{background:var(--accent);color:#000;
    border-color:var(--accent)}
  #app{display:flex;height:calc(100vh - 41px)}
  #sidebar{width:300px;border-right:1px solid var(--line);
    background:var(--panel);display:flex;flex-direction:column;overflow:hidden}
  #sidebar h2{margin:10px 12px 4px;font-size:12px;text-transform:uppercase;
    letter-spacing:0.08em;color:var(--muted)}
  #file-count{padding:0 12px;color:var(--muted);font-size:11px}
  #file-list{flex:1;overflow:auto;margin:6px 0;padding:0;list-style:none}
  #file-list li{display:flex;align-items:center;gap:8px;
    padding:5px 12px;cursor:pointer;border-left:2px solid transparent;
    font-size:12px;line-height:1.3}
  #file-list li:hover{background:rgba(255,255,255,0.04);
    border-left-color:var(--accent)}
  /* Persisted "selected" state — sticks after click until another file picked.
     Slightly stronger than hover so the user can always tell which file is
     the focus, even after panning/zooming refreshes the list. */
  #file-list li.selected{background:rgba(88,166,255,0.18);
    border-left-color:var(--accent)}
  #file-list li.selected:hover{background:rgba(88,166,255,0.22)}
  #file-list li .dot{width:9px;height:9px;border-radius:50%;
    flex-shrink:0;border:1px solid rgba(255,255,255,0.2)}
  #file-list li .text{overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  #file-list li .text small{color:var(--muted);font-size:10px;display:block}
  #res-switcher{padding:10px 12px;border-top:1px solid var(--line)}
  #res-switcher h3{margin:0 0 6px;font-size:11px;text-transform:uppercase;
    letter-spacing:0.08em;color:var(--muted);font-weight:600}
  #res-switcher .btns{display:flex;gap:4px;flex-wrap:wrap}
  #res-switcher button{flex:1;min-width:50px;background:#21262d;
    color:var(--text);border:1px solid var(--line);padding:5px;cursor:pointer;
    border-radius:3px;font-size:11px}
  #res-switcher button.active{background:var(--accent);color:#000;
    border-color:var(--accent)}
  #res-switcher .auto-line{margin-top:6px;font-size:10px;color:var(--muted)}
  #legend{padding:10px 12px;border-top:1px solid var(--line)}
  #legend h3{margin:0 0 6px;font-size:11px;text-transform:uppercase;
    letter-spacing:0.08em;color:var(--muted);font-weight:600}
  #legend .row{display:flex;align-items:center;gap:6px;
    font-size:11px;color:var(--muted);padding:2px 0}
  #legend .swatch{width:11px;height:11px;border-radius:2px}
  #main{flex:1;position:relative}
  .view{position:absolute;inset:0;display:none}
  .view.active{display:block}
  #map{height:100%;background:#000}
  #graph{height:100%;background:#0d1117}
  .h3-tooltip{background:rgba(0,0,0,0.86);color:#fff;
    padding:8px 10px;border-radius:4px;font-size:11px;line-height:1.45;
    max-width:280px}
  .h3-tooltip b{color:#fff}
  .h3-tooltip ul{margin:4px 0 0;padding:0 0 0 14px}
  /* Strip Leaflet's default white tooltip chrome — our inner h3-tooltip
     div carries its own dark styling. */
  .leaflet-tooltip{border:none;padding:0;background:transparent;
    box-shadow:none}
  .leaflet-tooltip:before{display:none}  /* hide the white pointer triangle */
  .leaflet-popup-content{margin:10px 14px;color:#000}
  .leaflet-popup-content a{color:#0366d6;cursor:pointer}
  /* Dark scrollbars across the whole page so the file list doesn't show
     a default white track on Windows/Chrome. */
  *::-webkit-scrollbar{width:10px;height:10px}
  *::-webkit-scrollbar-track{background:transparent}
  *::-webkit-scrollbar-thumb{background:#30363d;border-radius:5px;
    border:2px solid transparent;background-clip:padding-box}
  *::-webkit-scrollbar-thumb:hover{background:#484f58;
    border:2px solid transparent;background-clip:padding-box}
  *::-webkit-scrollbar-corner{background:transparent}
  /* Firefox */
  *{scrollbar-width:thin;scrollbar-color:#30363d transparent}
  /* Density colour ramp legend (gradient under H3 colour scale label) */
  #density-ramp{height:8px;border-radius:2px;margin:4px 0 2px;
    background:linear-gradient(to right,
      #ffffcc,#ffeda0,#fed976,#feb24c,#fd8d3c,#fc4e2a,#e31a1c,#bd0026,#800026)}
  #density-labels{display:flex;justify-content:space-between;
    font-size:10px;color:var(--muted)}
</style>
</head>

// Tracks the currently-selected file across views; lets the sidebar
// re-apply the .selected class after every viewport refresh, and lets the
// graph pulse-spotlight know which node to highlight.
let _selectedFileId = null;

// Build ALL_FILES from graph nodes + lookup spatial info from RECORDS.
// In Graph view the sidebar lists every file_asset (whether or not it has a
// footprint); in Map view it lists only those with spatial info.
const SPATIAL_BY_ID = Object.fromEntries(RECORDS.map(r => [r.id, r]));
const ALL_FILES = GRAPH_NODES
  .filter(n => n.group === 'file_asset')
  .map(n => {
    const sp = SPATIAL_BY_ID[n.id];
    return {
      id: n.id, label: n.label,
      path: n.path || '',
      type: n.type || 'other',
      lat: sp ? sp.lat : null,
      lon: sp ? sp.lon : null,
    };
  });

// ---------- Density colour ramp (YlOrRd) ----------
// Sequential YlOrRd reads well on dark basemap. Linear interpolation between
// these 9 stops; t∈[0,1] computed from cell count / global max.
const DENSITY_STOPS = [
  [255,255,204], [255,237,160], [254,217,118], [254,178,76],
  [253,141,60],  [252,78,42],   [227,26,28],   [189,0,38], [128,0,38]
];
function densityColor(t) {
  t = Math.max(0, Math.min(1, t));
  const idx = t * (DENSITY_STOPS.length - 1);
  const lo = Math.floor(idx), hi = Math.min(lo + 1, DENSITY_STOPS.length - 1);
  const f = idx - lo;
  const a = DENSITY_STOPS[lo], b = DENSITY_STOPS[hi];
  const r = Math.round(a[0] * (1-f) + b[0] * f);
  const g = Math.round(a[1] * (1-f) + b[1] * f);
  const bl = Math.round(a[2] * (1-f) + b[2] * f);
  return `rgb(${r},${g},${bl})`;
}

// ---------- Tab toggle ----------
let currentTab = 'map';
const tabMap = document.getElementById('tab-map');
const tabGraph = document.getElementById('tab-graph');
const viewMap = document.getElementById('view-map');
const viewGraph = document.getElementById('view-graph');
function switchTab(name) {
  currentTab = name;
  if (name === 'map') {
    tabMap.classList.add('active'); tabGraph.classList.remove('active');
    viewMap.classList.add('active'); viewGraph.classList.remove('active');
    setTimeout(() => { map.invalidateSize(); updateSidebar(); }, 60);
  } else {
    tabGraph.classList.add('active'); tabMap.classList.remove('active');
    viewGraph.classList.add('active'); viewMap.classList.remove('active');
    initGraph();
    setTimeout(() => { if (network) { network.redraw(); updateSidebar(); } }, 80);
  }
}
tabMap.onclick   = () => switchTab('map');
tabGraph.onclick = () => switchTab('graph');

// ---------- File-type legend (sidebar dot colours) ----------
const legendRows = document.getElementById('legend-rows');
for (const [type, color] of Object.entries(TYPE_COLORS)) {
  const cnt = ALL_FILES.filter(r => r.type === type).length;
  if (cnt === 0) continue;
  const div = document.createElement('div'); div.className = 'row';
  div.innerHTML = `<span class="swatch" style="background:${color}"></span>` +
                  `${type} <span style="margin-left:auto">${cnt}</span>`;
  legendRows.appendChild(div);
}

// ---------- Map ----------
const map = L.map('map', { preferCanvas:true, zoomControl:true }).setView([20, 0], 2);
L.tileLayer(
  'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
  { attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 19, subdomains: 'abcd' }
).addTo(map);

// Auto-fit on load to the spatial records' bbox
if (RECORDS.length > 0) {
  const lats = RECORDS.map(r => r.lat), lons = RECORDS.map(r => r.lon);
  const bbox = [[Math.min(...lats), Math.min(...lons)],
                [Math.max(...lats), Math.max(...lons)]];
  map.fitBounds(bbox, { padding: [30, 30], maxZoom: 8 });
}

// ---------- H3 layer + resolution control ----------
let userPickedRes = null; // null = auto; otherwise an int
const h3Layer = L.layerGroup().addTo(map);

function autoResForZoom(z) {
  if (z < 4) return 1;
  if (z < 6) return 2;
  if (z < 8) return 3;
  if (z < 10) return 4;
  if (z < 12) return 5;
  if (z < 14) return 6;
  if (z < 16) return 7;
  return 8;
}

function currentResolution() {
  return userPickedRes !== null ? userPickedRes : autoResForZoom(map.getZoom());
}

function buildH3Cells(records, res) {
  const cells = new Map();
  for (const r of records) {
    const cell = h3.latLngToCell(r.lat, r.lon, res);
    let entry = cells.get(cell);
    if (!entry) { entry = { types: new Map(), items: [] }; cells.set(cell, entry); }
    entry.items.push(r);
    entry.types.set(r.type, (entry.types.get(r.type) || 0) + 1);
  }
  return cells;
}

function dominantType(typesMap) {
  let best = 'other', n = 0;
  for (const [t, c] of typesMap) if (c > n) { best = t; n = c; }
  return best;
}

// Map of cell_id -> [lat, lon] center so the sidebar's "centre on file"
// jump can also work via cell membership lookups.
let CELLS_INDEX = new Map();

function drawH3Layer() {
  h3Layer.clearLayers();
  CELLS_INDEX = new Map();
  const res = currentResolution();
  document.getElementById('auto-res').textContent =
    userPickedRes === null ? `${res} (z${map.getZoom()})` : `manual ${res}`;
  const cells = buildH3Cells(RECORDS, res);
  if (cells.size === 0) return;
  let maxCount = 0;
  for (const e of cells.values()) if (e.items.length > maxCount) maxCount = e.items.length;
  // Update density legend max readout
  const dmax = document.getElementById('density-max');
  if (dmax) dmax.textContent = `${maxCount} file${maxCount !== 1 ? 's' : ''}`;

  for (const [cell_id, entry] of cells) {
    // Density gradient: linear t = count / maxCount, mapped through YlOrRd.
    const t = entry.items.length / Math.max(1, maxCount);
    const fill = densityColor(t);
    const boundary = h3.cellToBoundary(cell_id);
    CELLS_INDEX.set(cell_id, boundary);
    const poly = L.polygon(boundary, {
      color: fill, weight: 0.5, opacity: 0.9,
      fillColor: fill, fillOpacity: 0.6 + 0.3 * t,
    });
    const typeRows = [...entry.types.entries()]
      .sort((a,b) => b[1] - a[1])
      .map(([t,c]) => `<li><span style="display:inline-block;width:8px;height:8px;background:${TYPE_COLORS[t]||'#666'};border-radius:50%;margin-right:4px"></span>${t} · ${c}</li>`)
      .join('');
    poly.bindTooltip(
      `<div class="h3-tooltip"><b>${entry.items.length} file(s)</b><br>` +
      `cell: <code>${cell_id}</code><ul>${typeRows}</ul></div>`,
      { sticky: true }
    );
    poly.on('click', (ev) => {
      const html = `<b>${entry.items.length} files in cell</b><br>` +
        `<small>cell: ${cell_id}</small><ul style="margin:6px 0;padding:0 0 0 14px">` +
        entry.items.slice(0, 25).map(r =>
          `<li><a onclick="window._openInGraph('${r.id}');return false">` +
          `${r.label}</a><br><small style="color:#666">${r.path || ''}</small></li>`
        ).join('') + '</ul>';
      L.popup({ maxWidth: 360 }).setLatLng(ev.latlng).setContent(html).openOn(map);
    });
    poly.on('mouseover', () => poly.setStyle({ color: '#fff', weight: 2 }));
    poly.on('mouseout',  () => poly.setStyle({ color: fill, weight: 0.5 }));
    poly.addTo(h3Layer);
  }
}

// ---------- Pan/zoom helpers used by the sidebar click ----------
function centerOnFileMap(file) {
  if (file.lat == null || file.lon == null) return;
  // Fit to the H3 cell containing the file at current resolution — that way
  // "centre on this file" lands on the same hex the sidebar dot belongs to.
  const res = currentResolution();
  const cell = h3.latLngToCell(file.lat, file.lon, res);
  const boundary = h3.cellToBoundary(cell);
  map.flyToBounds(boundary, {
    padding: [60, 60],
    maxZoom: Math.max(11, map.getZoom()),
    duration: 0.6,
  });
}

function centerOnFileGraph(file) {
  if (!network) initGraph();
  if (!network) return;
  try {
    network.selectNodes([file.id]);
    network.focus(file.id, {
      scale: 1.6,
      animation: { duration: 600, easingFunction: 'easeInOutQuad' },
    });
    spotlightGraphNode(file.id);
  } catch (e) { console.warn('node focus failed:', e); }
}

// ---------- Graph-node pulse spotlight ----------
// Make the currently-focused node unmistakable in a 762-node graph: a thick
// gold border + glow shadow that gently pulses size every ~750ms. We restore
// the original node properties when the spotlight moves to another node.
let _spotlightTimer = null;
let _spotlightedId = null;
const _SPOTLIGHT_ORIG = {};   // nodeId -> snapshot of {borderWidth, color, shadow}

function _snapshotNode(id) {
  if (!network) return null;
  const n = network.body.data.nodes.get(id);
  if (!n) return null;
  // Capture only the fields we mutate, so restore is precise.
  return {
    borderWidth: n.borderWidth ?? null,
    color: n.color ?? null,
    shadow: n.shadow ?? null,
  };
}

function _restoreNode(id) {
  if (!network || !_SPOTLIGHT_ORIG[id]) return;
  const orig = _SPOTLIGHT_ORIG[id];
  network.body.data.nodes.update({
    id: id,
    // Restore by writing original values back; null means "leave default".
    borderWidth: orig.borderWidth ?? 1,
    color: orig.color ?? undefined,
    shadow: orig.shadow ?? { enabled: false },
  });
  delete _SPOTLIGHT_ORIG[id];
}

function spotlightGraphNode(id) {
  if (!network) return;
  // Clear previous spotlight if any.
  if (_spotlightTimer) { clearInterval(_spotlightTimer); _spotlightTimer = null; }
  if (_spotlightedId && _spotlightedId !== id) _restoreNode(_spotlightedId);
  _spotlightedId = id;

  if (!_SPOTLIGHT_ORIG[id]) _SPOTLIGHT_ORIG[id] = _snapshotNode(id);

  // Two-phase pulse — alternates border width + glow size every 750 ms.
  // Kept mild: amplitude is small so it reads as "alive" not "alarming".
  let phase = 0;
  const apply = () => {
    phase = 1 - phase;
    const borderW = phase ? 4 : 3;
    const shadowSize = phase ? 22 : 14;
    network.body.data.nodes.update({
      id: id,
      borderWidth: borderW,
      color: { border: '#ffd166', background: '#ffd166', highlight: { border: '#ffd166', background: '#ffe9a3' } },
      shadow: {
        enabled: true,
        color: 'rgba(255,209,102,0.9)',
        size: shadowSize, x: 0, y: 0,
      },
    });
  };
  apply();
  _spotlightTimer = setInterval(apply, 750);
}

function clearGraphSpotlight() {
  if (_spotlightTimer) { clearInterval(_spotlightTimer); _spotlightTimer = null; }
  if (_spotlightedId) { _restoreNode(_spotlightedId); _spotlightedId = null; }
}

// ---------- Sidebar (tab-aware live filter) ----------
const fileCount = document.getElementById('file-count');
const fileList = document.getElementById('file-list');
const sidebarHeader = document.querySelector('#sidebar h2');

// Compute file_ids currently inside the graph's visible canvas viewport.
// vis-network's getPositions() returns canvas coords; DOMtoCanvas() lets us
// turn the visible DOM rectangle into canvas-space bounds to test against.
function _visibleGraphFileIds() {
  if (!network) return [];
  const container = document.getElementById('graph');
  const w = container.clientWidth, h = container.clientHeight;
  if (w < 5 || h < 5) return [];
  const tl = network.DOMtoCanvas({x: 0, y: 0});
  const br = network.DOMtoCanvas({x: w, y: h});
  const minX = Math.min(tl.x, br.x), maxX = Math.max(tl.x, br.x);
  const minY = Math.min(tl.y, br.y), maxY = Math.max(tl.y, br.y);
  const positions = network.getPositions();
  const out = [];
  for (const id in positions) {
    if (!id.startsWith('f-')) continue;
    const p = positions[id];
    if (p.x >= minX && p.x <= maxX && p.y >= minY && p.y <= maxY) out.push(id);
  }
  return out;
}

let _sidebarRafId = null;
function updateSidebar() {
  // Debounce via rAF — bench is small but graph drag can fire many events.
  if (_sidebarRafId) cancelAnimationFrame(_sidebarRafId);
  _sidebarRafId = requestAnimationFrame(_updateSidebarNow);
}

function _updateSidebarNow() {
  _sidebarRafId = null;
  let visible, total, label;
  if (currentTab === 'map') {
    const b = map.getBounds();
    visible = RECORDS.filter(r => b.contains([r.lat, r.lon]));
    total = RECORDS.length;
    label = 'Files in map view';
  } else {
    if (!network) { fileCount.textContent = '— graph loading —'; fileList.innerHTML = ''; return; }
    const visibleIds = new Set(_visibleGraphFileIds());
    visible = ALL_FILES.filter(f => visibleIds.has(f.id));
    total = ALL_FILES.length;
    label = 'Files in graph view';
  }
  sidebarHeader.textContent = label;
  fileCount.textContent = `${visible.length} of ${total} files in view`;
  fileList.innerHTML = '';
  const slice = visible.slice(0, 300);
  for (const r of slice) {
    const li = document.createElement('li');
    li.title = `${r.id} · ${r.path}`;
    const hasSpatial = r.lat != null && r.lon != null;
    li.innerHTML =
      `<span class="dot" style="background:${TYPE_COLORS[r.type]||TYPE_COLORS.other}"></span>` +
      `<span class="text">${r.label}` +
      `<small>${r.type}${hasSpatial ? '' : ' · (no spatial)'} · ${r.path || ''}</small></span>`;
    // Re-apply persisted selection on every rebuild (viewport refreshes
    // wipe the DOM nodes, so we re-mark the .selected one each time).
    if (_selectedFileId === r.id) li.classList.add('selected');
    li.onclick = () => {
      _selectedFileId = r.id;
      // Refresh the list so the previous selection's .selected goes away.
      _updateSidebarNow();
      if (currentTab === 'map') centerOnFileMap(r);
      else                       centerOnFileGraph(r);
    };
    fileList.appendChild(li);
  }
  if (visible.length > slice.length) {
    const li = document.createElement('li');
    li.innerHTML = `<span style="color:#888;font-style:italic">… +${visible.length - slice.length} more (zoom in to narrow)</span>`;
    fileList.appendChild(li);
  }
}

// ---------- Map events ----------
map.on('zoomend', () => { drawH3Layer(); updateSidebar(); });
map.on('moveend', updateSidebar);

// ---------- Resolution switcher buttons ----------
document.querySelectorAll('#res-switcher .btns button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('#res-switcher .btns button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    const val = b.dataset.res;
    userPickedRes = (val === 'auto') ? null : parseInt(val, 10);
    drawH3Layer();
  };
});

// ---------- vis-network graph ----------
let network = null;
function initGraph() {
  if (network) return;
  const nodes = new vis.DataSet(GRAPH_NODES);
  const edges = new vis.DataSet(GRAPH_EDGES);
  network = new vis.Network(document.getElementById('graph'), { nodes, edges }, {
    nodes:{ shape:'dot', size:10, font:{ color:'#c9d1d9', size:11 } },
    edges:{ font:{ color:'#8b949e', size:9 }, color:{ color:'#30363d' }, smooth:false },
    groups:{
      'project':{ color:'#1f6f5b' },
      'file_asset':{ color:'#2454a6' },
      'spatial_footprint':{ color:'#8a5a00' },
      'spatial_point':{ color:'#a64a1f' },
      'concept':{ color:'#6f42c1' },
      'permit':{ color:'#666' },
      'bbox':{ color:'#555' },
    },
    physics: GRAPH_NODES.length > 200
      ? { stabilization:{ iterations:300 }, solver:'forceAtlas2Based' }
      : { stabilization:true },
  });
  network.once('stabilizationIterationsDone', () => {
    network.setOptions({ physics:{ enabled:false } });
    // Once nodes settle, fill the graph sidebar if we're already in graph view.
    if (currentTab === 'graph') updateSidebar();
  });

  // Refresh sidebar when the viewport changes (pan via drag, zoom via wheel).
  network.on('dragEnd',  () => { if (currentTab === 'graph') updateSidebar(); });
  network.on('zoom',     () => { if (currentTab === 'graph') updateSidebar(); });
  network.on('animationFinished', () => {
    if (currentTab === 'graph') updateSidebar();
  });
}

// ---------- Cross-tab handoff ----------
window._openInGraph = function(fileId) {
  _selectedFileId = fileId;
  switchTab('graph');
  initGraph();
  setTimeout(() => {
    try {
      network.selectNodes([fileId]);
      network.focus(fileId, { scale: 1.4, animation: { duration: 600, easingFunction: 'easeInOutQuad' } });
      spotlightGraphNode(fileId);
    } catch (e) { console.warn('node not found in graph:', fileId, e); }
  }, 120);
};

// Initial draw
drawH3Layer();
updateSidebar();
setTimeout(initGraph, 200);
</script>
</body>
</html>
